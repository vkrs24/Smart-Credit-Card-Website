<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/8831de0bd0.js" crossorigin="anonymous"></script>
    <link rel="icon" href="images/dolar.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style.css" type="text/css">
    <title>Smart Credit</title>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-dollar-sign"></i>
            </div>
            <div class="links">
                <a href="">Features</a>
                <a href="">Pricing</a>
                <a href="">Help</a>
                <a href="">Blog</a>
                <a href="">About us</a>
            </div>
            <div class="auth-buttons">
                <button class="login">Login</button>
                <button class="signup">Sign Up</button>
            </div>
        </header>
        <main>
            <section>
                <div class="header_section toogle_disabled">
                    <div class="logo">
                        <i class="fa-solid fa-dollar-sign"></i>
                    </div>
                    <div onclick="toogle()" class="toggle">
                        <i class="fa-solid fa-bars"></i>
                    </div>
                </div>
                <div class="toggle_section">
                    <div class="toggle_links">
                        <a href="">Features</a>
                        <a href="">Pricing</a>
                        <a href="">Help</a>
                        <a href="">Blog</a>
                        <a href="">About us</a>
                        <a href="">Login</a>
                        <a href="">Signup</a>
                    </div>
                </div>
                <div class="card_logo">
                    <img src="images/card.jpg" alt="">
                </div>
                <div class="card_content">
                    <div class="card_slogan">
                        <h6>START SAVING MONEY</h6>
                    </div>
                    <div class="card_title">
                        <h1>
                            Smart Credit Card For Your Daily Life.
                        </h1>
                    </div>
                    <div class="download">
                        <button>Download</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
